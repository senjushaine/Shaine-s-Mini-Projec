<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idea BookLand by Shaine Khant Paing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --bg: #0f172a; --sidebar: #1e293b; --text: #f1f5f9;
            --border: rgba(255,255,255,0.1); --paper: #1e293b;
            --accent: #00BFC0;
            --grad-pink: linear-gradient(135deg, #FE0D6D 0%, #FF9797 100%);
            --grad-blue: linear-gradient(135deg, #00A1D8 0%, #00BFC0 100%);
            --grad-purple: linear-gradient(135deg, #7851A5 0%, #E6B1D3 100%);
            --grad-orange: linear-gradient(135deg, #FD5E00 0%, #FFCC80 100%);
        }
        .light-mode {
            --bg: #f8fafc; --sidebar: #ffffff; --text: #0f172a;
            --border: rgba(0,0,0,0.08); --paper: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* --- DASHBOARD & PREMIUM GRADIENTS --- */
        #homeScreen { height: 100vh; overflow-y: auto; padding: 0 20px 100px; }
        .premium-header { padding: 45px 5px 25px; }
        .logo-main { font-family: 'Pacifico', cursive; font-size: 2.5rem; background: linear-gradient(45deg, #00A1D8, #FE0D6D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; }
        
        .note-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 20px; }
        .note-widget { 
            aspect-ratio: 1/1; padding: 22px; border-radius: 32px; position: relative; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; flex-direction: column; overflow: hidden;
            background: rgba(30, 41, 59, 0.5); border: 1px solid var(--border);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        /* DYNAMIC MESH GRADIENTS */
        .note-widget[data-style="pink"] { background: var(--grad-pink); color: white; border: none; }
        .note-widget[data-style="blue"] { background: var(--grad-blue); color: white; border: none; }
        .note-widget[data-style="purple"] { background: var(--grad-purple); color: white; border: none; }
        .note-widget[data-style="orange"] { background: var(--grad-orange); color: white; border: none; }

        /* LONG PRESS DELETE SYSTEM */
        .note-widget.shaking { animation: shake 0.3s infinite; transform: scale(0.95); }
        @keyframes shake { 0% { transform: rotate(-1deg); } 50% { transform: rotate(1.1deg); } 100% { transform: rotate(-1deg); } }
        
        .delete-overlay { 
            position: absolute; inset: 0; background: rgba(252, 34, 32, 0.9); 
            display: flex; align-items: center; justify-content: center; 
            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 10; font-size: 1.8rem;
        }
        .shaking .delete-overlay { opacity: 1; pointer-events: auto; }

        /* --- CANVAS & COMPLETE HIDE TOOLBAR --- */
        .screen { position: fixed; inset: 0; display: none; background: var(--bg); }
        .active-screen { display: flex; animation: premiumFade 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes premiumFade { from { opacity: 0; transform: scale(1.08); filter: blur(10px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }

        #canvasScreen { flex-direction: row; }
        #sideToolbar { 
            width: 85px; background: var(--sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; align-items: center; padding: 20px 0 120px; gap: 12px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 50;
        }
        .toolbar-hidden #sideToolbar { width: 0; transform: translateX(-110%); opacity: 0; visibility: hidden; }
        
        /* CORRECTED TOGGLE BUTTON POSITION */
        .toolbar-toggle {
            position: absolute; bottom: 45px; left: 18px; width: 55px; height: 55px;
            background: var(--accent); color: white; border-radius: 50%; border: none;
            z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-size: 1.7rem;
            display: flex; align-items: center; justify-content: center;
        }

        .paper-canvas { flex: 1; margin: 12px; border-radius: 35px; background: var(--paper); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        #editor { flex: 1; padding: 0 30px 50px; overflow-y: auto; font-size: 1.2rem; line-height: 1.8; }
        #noteTitle { width: 100%; background: transparent; border: none; color: var(--text); font-size: 2rem; font-weight: 700; padding: 40px 30px 10px; }

        /* TOOL STYLES */
        .tool-btn { width: 52px; height: 52px; border-radius: 15px; border: none; background: transparent; color: var(--text); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; }
        .tool-btn:active { background: rgba(255,255,255,0.15); }
        .color-circle { width: 38px; height: 38px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
    </style>
</head>
<body>

    <section id="homeScreen" class="screen active-screen">
        <div class="premium-header">
            <div class="logo-main">Idea BookLand</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                <span style="opacity:0.5; font-size:0.85rem;">by Shaine Khant Paing</span>
                <button onclick="toggleTheme()" style="background:none; border:none; font-size:1.2rem;">🌓</button>
            </div>
            <div id="selStatus" style="display:none; color:var(--accent); font-weight:700; margin-top:15px; background:rgba(0,191,192,0.1); padding:10px; border-radius:12px; text-align:center;" onclick="stopSelection()">
                Tap Boxes to Delete • Done
            </div>
        </div>
        <div class="note-grid" id="noteGrid"></div>
        <button onclick="enterCanvas(null)" style="position:fixed; bottom:40px; right:25px; width:70px; height:70px; border-radius:24px; background:var(--accent); color:white; border:none; font-size:2.2rem; box-shadow:0 10px 30px rgba(0,191,192,0.4); z-index:20;">＋</button>
    </section>

    <section id="canvasScreen" class="screen">
        <button class="toolbar-toggle" onclick="document.body.classList.toggle('toolbar-hidden')">⚒</button>
        <aside id="sideToolbar">
            <button class="tool-btn" onclick="exitToHome()">🏠</button>
            <div style="width:40px; height:1px; background:var(--border); margin:5px 0;"></div>
            <button class="tool-btn" onclick="exec('bold')"><b>B</b></button>
            <button class="tool-btn" onclick="exec('italic')"><i>I</i></button>
            <button class="tool-btn" onclick="exec('underline')"><u>U</u></button>
            <button class="tool-btn" onclick="exec('hiliteColor', '#FFE964')">🖍</button>
            <button class="tool-btn" onclick="exec('removeFormat')">🚫</button>
            <div style="width:40px; height:1px; background:var(--border); margin:5px 0;"></div>
            <button class="tool-btn" onclick="exec('insertUnorderedList')">●</button>
            <button class="tool-btn" onclick="exec('justifyCenter')">↔</button>
            <div style="margin-top:auto; display:flex; flex-direction:column; gap:15px; align-items:center;">
                <input type="color" onchange="exec('foreColor', this.value)" class="color-circle" title="Text Color">
                <input type="color" onchange="updateCanvasColor(this.value)" class="color-circle" title="Canvas Color">
            </div>
        </aside>

        <div style="flex:1; display:flex; flex-direction:column;">
            <header style="padding:20px 25px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.8rem; font-weight:600; color:var(--accent);">Synced Cloud</span>
                <button onclick="exitToHome()" style="background:var(--sidebar); border:1px solid var(--border); color:var(--text); padding:8px 20px; border-radius:15px; font-weight:600;">Exit</button>
            </header>
            <div class="paper-canvas" id="canvasFrame">
                <input type="text" id="noteTitle" placeholder="Idea Name..." oninput="autoSave()">
                <div id="editor" contenteditable="true" oninput="autoSave()"></div>
            </div>
        </div>
    </section>

    <script>
        let notes = JSON.parse(localStorage.getItem('BookLandData')) || [];
        let activeId = null;
        let isSelecting = false;
        let holdTimer;

        // ALL 56 GOODNOTES COLORS
        const palette = ["#EE7EA0", "#FFA9BA", "#FFD7D6", "#FF9797", "#EA7D70", "#F65353", "#D20000", "#FD5E00", "#F58553", "#FFA07A", "#FBBF9B", "#FFAF6E", "#F59A23", "#FCB55C", "#FFCC80", "#FFD6A2", "#EEB649", "#CE8540", "#FEF7B5", "#F6DE6C", "#F7CE15", "#BCC07B", "#DBE098", "#C1DB9E", "#91CA57", "#669E63", "#007355", "#007D75", "#75B39C", "#ADD2CA", "#D5E2D3", "#7CCED2", "#D5EDF8", "#ABCDDE", "#65C0E6", "#1EB0E6", "#03468F", "#7D8BE0", "#B5BEF5", "#CDBDEB", "#E1CEE5", "#EFD5FF", "#F6E7FF", "#9A81B0", "#7851A5", "#E6B1D3", "#B19F9A", "#E1CFCA", "#F1ECEA", "#E5DACA", "#C9A98D", "#8E715B", "#4F3F3E", "#D2D2D2", "#AAAAAA", "#363636"];
        const gradients = ['pink', 'blue', 'purple', 'orange'];

        function renderDashboard() {
            const grid = document.getElementById('noteGrid');
            grid.innerHTML = '';
            notes.forEach(n => {
                const widget = document.createElement('div');
                widget.className = `note-widget ${isSelecting ? 'shaking' : ''}`;
                widget.setAttribute('data-style', n.style || 'default');
                if(!n.style && n.color) widget.style.backgroundColor = n.color;

                widget.innerHTML = `
                    <div class="delete-overlay" onclick="deleteNote(event, ${n.id})">🗑️</div>
                    <h4 style="margin:0; font-size:1.2rem;">${n.title || 'Untitled Idea'}</h4>
                    <p style="font-size:0.75rem; opacity:0.6; margin-top:auto;">${new Date(n.id).toLocaleDateString()}</p>
                `;

                // Gesture logic
                widget.onmousedown = widget.ontouchstart = () => { if(!isSelecting) holdTimer = setTimeout(startSelection, 800); };
                widget.onmouseup = widget.ontouchend = () => clearTimeout(holdTimer);
                widget.onclick = () => { if(!isSelecting) enterCanvas(n.id); };

                grid.appendChild(widget);
            });
        }

        function startSelection() { isSelecting = true; document.getElementById('selStatus').style.display = 'block'; renderDashboard(); }
        function stopSelection() { isSelecting = false; document.getElementById('selStatus').style.display = 'none'; renderDashboard(); }

        function deleteNote(e, id) {
            e.stopPropagation();
            notes = notes.filter(n => n.id !== id);
            save(); renderDashboard();
            if(notes.length === 0) stopSelection();
        }

        function enterCanvas(id) {
            if (!id) {
                const newNote = { id: Date.now(), title: "", content: "", style: gradients[Math.floor(Math.random()*4)] };
                notes.unshift(newNote); activeId = newNote.id;
            } else { activeId = id; }
            const n = notes.find(n => n.id === activeId);
            document.getElementById('noteTitle').value = n.title;
            document.getElementById('editor').innerHTML = n.content;
            document.getElementById('canvasFrame').style.backgroundColor = n.color || "var(--paper)";
            document.getElementById('homeScreen').classList.remove('active-screen');
            document.getElementById('canvasScreen').classList.add('active-screen');
        }

        function exitToHome() {
            document.getElementById('canvasScreen').classList.remove('active-screen');
            document.getElementById('homeScreen').classList.add('active-screen');
            renderDashboard();
        }

        function exec(cmd, val = null) { document.getElementById('editor').focus(); document.execCommand(cmd, false, val); autoSave(); }
        function updateCanvasColor(color) { document.getElementById('canvasFrame').style.backgroundColor = color; const n = notes.find(n => n.id === activeId); if(n) { n.color = color; n.style = null; } save(); }
        function autoSave() { const n = notes.find(n => n.id === activeId); if(n) { n.title = document.getElementById('noteTitle').value; n.content = document.getElementById('editor').innerHTML; save(); } }
        function save() { localStorage.setItem('BookLandData', JSON.stringify(notes)); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        renderDashboard();
    </script>
</body>
</html>
