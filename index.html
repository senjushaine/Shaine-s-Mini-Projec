<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idea BookLand</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700;800&display=swap');

        :root {
            --bg: #0f172a; --sidebar: #1e293b; --text: #f1f5f9;
            --border: rgba(255,255,255,0.1); --paper: #1e293b;
            --accent: #00BFC0;
            --grad-pink: linear-gradient(135deg, #FE0D6D 0%, #FF9797 100%);
            --grad-blue: linear-gradient(135deg, #00A1D8 0%, #00BFC0 100%);
            --grad-purple: linear-gradient(135deg, #7851A5 0%, #E6B1D3 100%);
            --grad-orange: linear-gradient(135deg, #FD5E00 0%, #FFCC80 100%);
        }

        .light-mode {
            --bg: #f8fafc; --sidebar: #ffffff; --text: #0f172a;
            --border: rgba(0,0,0,0.08); --paper: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; transition: background 0.4s, color 0.4s; }
        body, html { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        .screen { position: fixed; inset: 0; display: none; opacity: 0; transform: translateY(15px); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .screen.active { display: flex; opacity: 1; transform: translateY(0); }

        /* --- HOME SCREEN --- */
        #homeScreen { flex-direction: column; padding: 0 25px 120px; overflow-y: auto; }
        .logo-area { padding: 50px 0 30px; display: flex; justify-content: space-between; align-items: flex-start; }
        .logo-main { font-family: 'Pacifico', cursive; font-size: 2.6rem; background: linear-gradient(45deg, #00A1D8, #FE0D6D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; }
        .user-credit { opacity: 0.6; font-size: 0.85rem; font-weight: 400; margin-top: -5px; }
        
        .note-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; width: 100%; }
        .note-card { 
            aspect-ratio: 1/1; padding: 22px; border-radius: 28px; position: relative; 
            display: flex; flex-direction: column; overflow: hidden;
            background: var(--sidebar); border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); cursor: pointer;
        }
        .note-card[data-style="pink"] { background: var(--grad-pink); color: white; border: none; }
        .note-card[data-style="blue"] { background: var(--grad-blue); color: white; border: none; }
        .note-card[data-style="purple"] { background: var(--grad-purple); color: white; border: none; }
        .note-card[data-style="orange"] { background: var(--grad-orange); color: white; border: none; }

        .del-overlay { position: absolute; inset: 0; background: rgba(255, 30, 30, 0.85); display: none; align-items: center; justify-content: center; z-index: 5; font-size: 2rem; color: white; }
        .shaking .del-overlay { display: flex; }

        /* --- CANVAS SCREEN --- */
        #canvasScreen { flex-direction: row; }
        #sideBar { width: 75px; background: var(--sidebar); display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid var(--border); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; }
        .toolbar-hidden #sideBar { margin-left: -75px; opacity: 0; }

        .t-btn { width: 48px; height: 48px; border-radius: 14px; border: none; background: transparent; color: var(--text); font-size: 1.2rem; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }

        .palette-popup {
            position: fixed; left: 85px; bottom: 90px; background: var(--sidebar);
            border: 1px solid var(--border); border-radius: 24px; padding: 18px;
            display: none; grid-template-columns: repeat(4, 1fr); gap: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 200;
        }
        .color-dot { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); }

        .editor-space { flex: 1; display: flex; flex-direction: column; background: var(--paper); }
        #editor { flex: 1; padding: 10px 30px 100px; font-size: 1.3rem; overflow-y: auto; line-height: 1.7; color: var(--text); font-weight: 300; }
        #titleInput { width: 100%; border: none; background: transparent; color: var(--text); font-size: 2.4rem; font-weight: 800; padding: 45px 30px 10px; font-family: 'Playfair Display', serif; }

        .fab-add { position: fixed; bottom: 35px; right: 25px; width: 75px; height: 75px; border-radius: 26px; background: var(--accent); color: white; border: none; font-size: 2.2rem; box-shadow: 0 12px 30px rgba(0,191,192,0.4); z-index: 90; }
        .fab-tool { position: fixed; bottom: 30px; left: 15px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: white; border: none; z-index: 1000; font-size: 1.4rem; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        #doneBtn { position: fixed; top: 50px; right: 25px; display: none; color: var(--accent); font-weight: 700; background: var(--sidebar); padding: 8px 20px; border-radius: 16px; border: 1px solid var(--border); z-index: 101; }
    </style>
</head>
<body class="toolbar-hidden">

    <section id="homeScreen" class="screen active">
        <div class="logo-area">
            <div>
                <div class="logo-main">Idea BookLand</div>
                <div class="user-credit">by Shaine Khant Paing</div>
            </div>
            <button class="t-btn" onclick="toggleTheme()" style="font-size: 1.5rem;">🌓</button>
        </div>
        <div id="doneBtn" onclick="disableEdit()">Done</div>
        <div class="note-grid" id="noteGrid"></div>
        <button class="fab-add" onclick="openNote(null)">＋</button>
    </section>

    <section id="canvasScreen" class="screen">
        <button class="fab-tool" onclick="document.body.classList.toggle('toolbar-hidden')">⚒</button>
        <aside id="sideBar">
            <button class="t-btn" onclick="closeNote()">🏠</button>
            <div style="height:1px; width:40px; background:var(--border); margin:12px 0;"></div>
            <button class="t-btn" onclick="doc('bold')"><b>B</b></button>
            <button class="t-btn" onclick="doc('italic')"><i>I</i></button>
            <button class="t-btn" onclick="doc('underline')"><u>U</u></button>
            <button class="t-btn" onclick="doc('insertUnorderedList')">●</button>
            <button class="t-btn" onclick="doc('justifyCenter')">≡</button>
            <div style="margin-top:auto; display: flex; flex-direction: column; gap: 12px;">
                <button class="t-btn" onclick="pop('text')" style="font-weight:700; color:var(--accent); border: 1.5px solid var(--accent);">A</button>
                <button class="t-btn" onclick="pop('paper')" style="background:var(--grad-pink); color:white; border-radius: 50%;">🎨</button>
            </div>
        </aside>

        <div id="palettePop" class="palette-popup"></div>

        <div class="editor-space" id="canvasBg">
            <header style="padding:20px 30px 0; display:flex; justify-content:space-between; align-items: center; opacity: 0.5;">
                <span style="font-size:0.75rem; font-weight:700; letter-spacing:1px;">PREMIUM CLOUD</span>
                <span id="saveStatus" style="font-size:0.75rem;">Connected</span>
            </header>
            <input type="text" id="titleInput" placeholder="Enter Title..." oninput="save()">
            <div id="editor" contenteditable="true" oninput="save()"></div>
        </div>
    </section>

    <script>
        let db = JSON.parse(localStorage.getItem('BookLandMasterV3')) || [];
        let activeId = null;
        let editMode = false;
        let timer;
        let paletteType = 'paper';
        let lastRange = null; // Store cursor position

        const colors = ["#EE7EA0", "#FE0D6D", "#00A1D8", "#00BFC0", "#91CA57", "#F7CE15", "#FD5E00", "#7851A5", "#363636", "#AAAAAA", "#F1ECEA", "#FFFFFF"];
        const styles = ['pink', 'blue', 'purple', 'orange'];

        function init() {
            const container = document.getElementById('palettePop');
            colors.forEach(c => {
                const d = document.createElement('div');
                d.className = 'color-dot';
                d.style.backgroundColor = c;
                d.onmousedown = (e) => { e.preventDefault(); applyColor(c); }; // Prevent focus loss
                container.appendChild(d);
            });
            renderHome();
        }

        // --- CURSOR PERSISTENCE LOGIC ---
        const editor = document.getElementById('editor');
        editor.addEventListener('mouseup', saveSelection);
        editor.addEventListener('keyup', saveSelection);

        function saveSelection() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) lastRange = sel.getRangeAt(0);
        }

        function restoreSelection() {
            if (lastRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(lastRange);
            }
        }

        function applyColor(c) {
            if (paletteType === 'paper') {
                document.getElementById('canvasBg').style.backgroundColor = c;
                const n = db.find(n => n.id === activeId);
                if (n) { n.bgColor = c; n.style = null; }
            } else {
                restoreSelection();
                document.execCommand('foreColor', false, c);
                editor.focus();
            }
            save();
            document.getElementById('palettePop').style.display = 'none';
        }

        function renderHome() {
            const grid = document.getElementById('noteGrid');
            grid.innerHTML = '';
            db.forEach(n => {
                const card = document.createElement('div');
                card.className = `note-card ${editMode ? 'shaking' : ''}`;
                card.setAttribute('data-style', n.style || '');
                if(n.bgColor) card.style.backgroundColor = n.bgColor;
                card.innerHTML = `
                    <div class="del-overlay" onclick="removeNote(event, ${n.id})">🗑️</div>
                    <h4 style="margin:0; font-size:1.3rem; line-height:1.2; font-family:'Playfair Display', serif;">${n.title || 'Draft'}</h4>
                    <p style="font-size:0.75rem; opacity:0.7; margin-top:auto; font-weight:600;">${new Date(n.id).toLocaleDateString()}</p>
                `;
                card.onmousedown = () => { if(!editMode) timer = setTimeout(enableEdit, 800); };
                card.onmouseup = () => clearTimeout(timer);
                card.onclick = () => { if(!editMode) openNote(n.id); };
                grid.appendChild(card);
            });
        }

        function openNote(id) {
            if(!id) {
                const n = { id: Date.now(), title: "", content: "", style: styles[Math.floor(Math.random()*4)] };
                db.unshift(n); activeId = n.id;
            } else { activeId = id; }
            const note = db.find(n => n.id === activeId);
            document.getElementById('titleInput').value = note.title;
            document.getElementById('editor').innerHTML = note.content;
            document.getElementById('canvasBg').style.backgroundColor = note.bgColor || "var(--paper)";
            switchScreen('canvasScreen');
        }

        function closeNote() { switchScreen('homeScreen'); renderHome(); }
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                setTimeout(() => s.style.display = 'none', 500);
            });
            setTimeout(() => {
                const target = document.getElementById(id);
                target.style.display = 'flex';
                setTimeout(() => target.classList.add('active'), 50);
            }, 550);
        }

        function doc(cmd, val = null) { document.execCommand(cmd, false, val); editor.focus(); save(); }
        function pop(type) { 
            paletteType = type; 
            const p = document.getElementById('palettePop');
            p.style.display = p.style.display === 'grid' ? 'none' : 'grid';
        }
        function save() {
            const n = db.find(n => n.id === activeId);
            if(n) {
                n.title = document.getElementById('titleInput').value;
                n.content = document.getElementById('editor').innerHTML;
                localStorage.setItem('BookLandMasterV3', JSON.stringify(db));
            }
        }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function enableEdit() { editMode = true; document.getElementById('doneBtn').style.display = 'block'; renderHome(); }
        function disableEdit() { editMode = false; document.getElementById('doneBtn').style.display = 'none'; renderHome(); }
        init();
    </script>
</body>
</html>
