<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idea BookLand Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap');

        :root {
            --bg: #0f172a; --sidebar: #1e293b; --text: #f1f5f9;
            --border: #334155; --paper: #1e293b;
            --logo-grad: linear-gradient(45deg, #FE0D6D, #00A1D8);
            --btn-grad: linear-gradient(135deg, #00BFC0, #3EC5A2);
            --delete-red: #FC2220;
        }
        .light-mode {
            --bg: #f8fafc; --sidebar: #ffffff; --text: #0f172a;
            --border: #cbd5e1; --paper: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar & Multi-Select */
        #sidebar { 
            width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; z-index: 200; transition: 0.3s;
        }
        .sidebar-hidden #sidebar { margin-left: -280px; }
        
        .logo-area { padding: 20px; font-family: 'Pacifico', cursive; font-size: 1.4rem; background: var(--logo-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; justify-content: space-between; align-items: center; }
        
        .note-list { flex: 1; overflow-y: auto; padding: 10px; }
        .note-item { padding: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.02); }
        .note-item.active { border: 2px solid #FFE964; background: rgba(255, 233, 100, 0.05); }
        .select-checkbox { width: 18px; height: 18px; accent-color: #3EC5A2; }

        /* Floating Bulk Action Button (Front & Center) */
        #bulkDeleteBtn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--delete-red); color: white; padding: 15px 25px;
            border-radius: 50px; font-weight: bold; border: none; z-index: 300;
            display: none; box-shadow: 0 10px 20px rgba(252, 34, 32, 0.4);
        }
        .bulk-mode #bulkDeleteBtn { display: block; }

        /* Main Area */
        #main { flex: 1; display: flex; position: relative; overflow: hidden; }
        
        /* VERTICAL SIDE TOOLBAR (Notion Style) */
        #sideToolbar {
            width: 50px; background: var(--sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 20px;
            transition: 0.3s;
        }
        .toolbar-hidden #sideToolbar { width: 0; padding: 0; overflow: hidden; border: none; }

        .tool-icon { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; opacity: 0.7; transition: 0.2s; }
        .tool-icon:hover { opacity: 1; transform: scale(1.1); }

        /* Canvas */
        .editor-container { flex: 1; display: flex; flex-direction: column; padding: 20px; background: var(--bg); }
        .paper-canvas { 
            flex: 1; background: var(--paper); border-radius: 15px; 
            display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid var(--border);
        }

        #editor { flex: 1; outline: none; padding: 0 30px 30px; overflow-y: auto; line-height: 1.6; font-size: 1.1rem; }
        
        /* Title Area with Color/Rename */
        .title-box { padding: 30px 30px 10px; display: flex; align-items: center; gap: 10px; }
        #noteTitle { 
            background: transparent; border: none; color: var(--text); 
            font-size: 2rem; font-weight: 700; outline: none; flex: 1;
        }

        /* Mobile Controls */
        .menu-trigger { position: absolute; top: 10px; right: 10px; z-index: 150; }

        @media (max-width: 600px) {
            #sidebar { position: absolute; height: 100%; }
            .sidebar-hidden #sidebar { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="sidebar-hidden">

    <button id="bulkDeleteBtn" onclick="deleteSelected()">🗑 Delete Selected Ideas</button>

    <aside id="sidebar">
        <div class="logo-area">
            <span>Idea BookLand</span>
            <button class="tool-icon" onclick="toggleSidebar()">✕</button>
        </div>
        <button onclick="addNote()" style="margin: 10px 20px; padding: 12px; background: var(--btn-grad); border:none; border-radius:10px; color:white; font-weight:600; cursor:pointer;">＋ New Idea</button>
        <div id="noteList" class="note-list"></div>
    </aside>

    <main id="main">
        <div id="sideToolbar">
            <button class="tool-icon" onclick="toggleSidebar()" title="Menu">☰</button>
            <button class="tool-icon" onclick="toggleTheme()" title="Theme">🌓</button>
            <hr style="width: 60%; border: 0.5px solid var(--border);">
            <button class="tool-icon" onclick="exec('bold')"><b>B</b></button>
            <button class="tool-icon" onclick="exec('italic')"><i>I</i></button>
            <input type="color" onchange="exec('foreColor', this.value)" style="width:25px; height:25px; border:none; cursor:pointer; background:none;">
            <input type="color" onchange="changeCanvasColor(this.value)" style="width:25px; height:25px; border:2px solid white; border-radius:4px; cursor:pointer; background:none;">
            <button class="tool-icon" onclick="deleteNote()" style="color: var(--delete-red); margin-top: auto;">🗑</button>
        </div>

        <div class="editor-container">
            <button onclick="toggleToolbar()" style="position: absolute; top: 10px; left: 10px; background: none; border: none; color: var(--text); opacity: 0.3; cursor: pointer;">⚙️</button>
            
            <div class="paper-canvas" id="canvasFrame">
                <div class="title-box">
                    <input type="text" id="noteTitle" placeholder="Untitled Idea" oninput="autoSave()">
                    <input type="color" onchange="changeTitleColor(this.value)" title="Title Color" style="width:20px; height:20px; border:none; cursor:pointer; background:none;">
                </div>
                <div id="editor" contenteditable="true" oninput="autoSave()"></div>
            </div>
        </div>
    </main>

    <script>
        let notes = JSON.parse(localStorage.getItem('ZenData')) || [];
        let activeId = null;
        let selectedNotes = new Set();

        function exec(cmd, val = null) {
            document.getElementById('editor').focus();
            document.execCommand(cmd, false, val);
            autoSave();
        }

        function changeTitleColor(color) {
            document.getElementById('noteTitle').style.color = color;
            const note = notes.find(n => n.id === activeId);
            if (note) note.titleColor = color;
            save();
        }

        function changeCanvasColor(color) {
            document.getElementById('canvasFrame').style.backgroundColor = color;
            const note = notes.find(n => n.id === activeId);
            if (note) note.canvasColor = color;
            save();
        }

        function toggleToolbar() { document.body.classList.toggle('toolbar-hidden'); }
        function toggleSidebar() { document.body.classList.toggle('sidebar-hidden'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('ZenTheme', document.body.classList.contains('light-mode')); }

        function init() {
            if (localStorage.getItem('ZenTheme') === 'true') document.body.classList.add('light-mode');
            if (notes.length === 0) addNote();
            else selectNote(notes[0].id);
            renderList();
        }

        function addNote() {
            const newNote = { id: Date.now(), title: "", content: "Start typing...", canvasColor: "", titleColor: "" };
            notes.unshift(newNote);
            selectNote(newNote.id);
            save();
        }

        function selectNote(id) {
            activeId = id;
            const note = notes.find(n => n.id === id);
            const titleEl = document.getElementById('noteTitle');
            titleEl.value = note.title;
            titleEl.style.color = note.titleColor || "var(--text)";
            document.getElementById('editor').innerHTML = note.content;
            document.getElementById('canvasFrame').style.backgroundColor = note.canvasColor || "var(--paper)";
            renderList();
        }

        function toggleSelect(id, event) {
            event.stopPropagation();
            selectedNotes.has(id) ? selectedNotes.delete(id) : selectedNotes.add(id);
            selectedNotes.size > 0 ? document.body.classList.add('bulk-mode') : document.body.classList.remove('bulk-mode');
            renderList();
        }

        function deleteSelected() {
            if (confirm(`Delete ${selectedNotes.size} ideas permanently?`)) {
                notes = notes.filter(n => !selectedNotes.has(n.id));
                selectedNotes.clear();
                document.body.classList.remove('bulk-mode');
                if (notes.length === 0) addNote(); else selectNote(notes[0].id);
                save();
            }
        }

        function deleteNote() {
            if (confirm("Discard this idea?")) {
                notes = notes.filter(n => n.id !== activeId);
                if (notes.length === 0) addNote(); else selectNote(notes[0].id);
                save();
            }
        }

        function autoSave() {
            const note = notes.find(n => n.id === activeId);
            if (note) {
                note.title = document.getElementById('noteTitle').value;
                note.content = document.getElementById('editor').innerHTML;
                save();
            }
        }

        function save() { localStorage.setItem('ZenData', JSON.stringify(notes)); renderList(); }

        function renderList() {
            const list = document.getElementById('noteList');
            list.innerHTML = notes.map(n => `
                <div class="note-item ${n.id === activeId ? 'active' : ''}" onclick="selectNote(${n.id})">
                    <input type="checkbox" class="select-checkbox" ${selectedNotes.has(n.id) ? 'checked' : ''} onclick="toggleSelect(${n.id}, event)">
                    <div style="flex:1; overflow:hidden;">
                        <div style="font-weight:600; white-space:nowrap; text-overflow:ellipsis;">${n.title || 'Untitled Idea'}</div>
                        <div style="font-size:10px; opacity:0.4;">${new Date(n.id).toLocaleDateString()}</div>
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
