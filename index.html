<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idea BookLand by Shaine Khant Paing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --bg: #0f172a; --sidebar: #1e293b; --text: #f1f5f9;
            --border: rgba(255,255,255,0.1); --paper: #1e293b;
            --accent: #00BFC0;
            --logo-grad: linear-gradient(45deg, #FE0D6D, #00A1D8);
            --card-bg: rgba(30, 41, 59, 0.7);
        }
        .light-mode {
            --bg: #f8fafc; --sidebar: #ffffff; --text: #0f172a;
            --border: rgba(0,0,0,0.1); --paper: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; transition: background 0.3s; }

        /* --- NAVIGATION --- */
        .screen { position: fixed; inset: 0; width: 100%; height: 100%; display: none; flex-direction: column; overflow: hidden; background: var(--bg); z-index: 10; }
        .active-screen { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- HOME SCREEN --- */
        #homeScreen { padding: 30px 20px; overflow-y: auto; }
        .logo-container { margin-bottom: 30px; }
        .logo-main { font-family: 'Pacifico', cursive; font-size: 2.2rem; background: var(--logo-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .logo-sub { font-size: 0.8rem; opacity: 0.7; font-weight: 300; letter-spacing: 1px; margin-top: 5px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 15px; border-radius: 18px; border: 1px solid var(--border); }
        .stat-card p { margin: 5px 0 0; font-size: 1.5rem; font-weight: 700; color: var(--accent); }

        .note-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding-bottom: 40px; }
        .note-widget { background: var(--card-bg); height: 160px; padding: 15px; border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .note-widget h4 { margin: 0; font-size: 0.95rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .add-new { background: var(--logo-grad); color: white; border: none; align-items: center; justify-content: center; text-align: center; }

        /* --- CANVAS SCREEN --- */
        #canvasScreen { flex-direction: row; }
        
        /* DYNAMIC TOOLBAR */
        #sideToolbar { 
            width: 60px; background: var(--sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 12px;
            transition: transform 0.3s ease, width 0.3s ease; z-index: 100;
        }
        .toolbar-hidden #sideToolbar { width: 0; transform: translateX(-60px); padding: 0; border: none; }
        
        .toolbar-toggle {
            position: absolute; bottom: 20px; left: 10px; width: 40px; height: 40px;
            background: var(--accent); color: white; border-radius: 50%; border: none;
            z-index: 110; display: flex; align-items: center; justify-content: center; font-weight: bold;
        }

        .editor-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        .canvas-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .exit-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }

        /* EXPANDED CANVAS */
        .paper-canvas { 
            flex: 1; margin: 0 10px 10px 10px; border-radius: 20px; 
            background: var(--paper); border: 1px solid var(--border); 
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #editor { flex: 1; padding: 0 25px 30px; outline: none; overflow-y: auto; font-size: 1.1rem; line-height: 1.6; }
        #noteTitle { width: 100%; background: transparent; border: none; color: var(--text); font-size: 1.8rem; font-weight: 700; padding: 25px 25px 10px; outline: none; }

        .tool-btn { width: 38px; height: 38px; border-radius: 8px; border: none; background: transparent; color: var(--text); cursor: pointer; font-size: 1.1rem; }
        .tool-btn:hover { background: rgba(255,255,255,0.1); }
        .divider { width: 30px; height: 1px; background: var(--border); margin: 4px 0; }
    </style>
</head>
<body class="dark-mode">

    <section id="homeScreen" class="screen active-screen">
        <div class="logo-container">
            <div class="logo-main">Idea BookLand</div>
            <div class="logo-sub">by Shaine Khant Paing</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><span>Total Ideas</span><p id="statCount">0</p></div>
            <div class="stat-card" onclick="toggleTheme()" style="cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:600;">🌓 Mode</div>
        </div>

        <div class="note-grid" id="noteGrid"></div>
    </section>

    <section id="canvasScreen" class="screen">
        <button class="toolbar-toggle" onclick="toggleToolbar()">⚒</button>
        
        <aside id="sideToolbar">
            <button class="tool-btn" onclick="exitToHome()">🏠</button>
            <div class="divider"></div>
            <button class="tool-btn" onclick="exec('bold')"><b>B</b></button>
            <button class="tool-btn" onclick="exec('italic')"><i>I</i></button>
            <button class="tool-btn" onclick="exec('underline')"><u>U</u></button>
            <button class="tool-btn" onclick="exec('strikeThrough')"><s>S</s></button>
            <div class="divider"></div>
            <button class="tool-btn" onclick="exec('justifyLeft')">⬅</button>
            <button class="tool-btn" onclick="exec('justifyCenter')">↔</button>
            <div class="divider"></div>
            <input type="color" onchange="exec('foreColor', this.value)" style="width:25px; height:25px; border:none; background:none; cursor:pointer;">
            <input type="color" onchange="updateCanvasColor(this.value)" style="width:25px; height:25px; border:2px solid white; border-radius:50%; background:none; cursor:pointer;">
            <button class="tool-btn" onclick="deleteActiveNote()" style="margin-top: auto; color: #FC2220;">🗑</button>
        </aside>

        <div class="editor-container">
            <header class="canvas-header">
                <span id="saveStatus" style="font-size: 0.7rem; opacity: 0.4;">Synced</span>
                <button class="exit-btn" onclick="exitToHome()">Exit ➜</button>
            </header>

            <div class="paper-canvas" id="canvasFrame">
                <input type="text" id="noteTitle" placeholder="Idea Title..." oninput="autoSave()">
                <div id="editor" contenteditable="true" oninput="autoSave()"></div>
            </div>
        </div>
    </section>

    <script>
        let notes = JSON.parse(localStorage.getItem('BookLandData')) || [];
        let activeId = null;

        function toggleToolbar() { document.body.classList.toggle('toolbar-hidden'); }
        function exitToHome() { document.getElementById('canvasScreen').classList.remove('active-screen'); document.getElementById('homeScreen').classList.add('active-screen'); renderDashboard(); }

        function enterCanvas(id) {
            if (!id) {
                const newNote = { id: Date.now(), title: "", content: "", color: "" };
                notes.unshift(newNote); activeId = newNote.id;
            } else { activeId = id; }
            loadNote();
            document.getElementById('homeScreen').classList.remove('active-screen');
            document.getElementById('canvasScreen').classList.add('active-screen');
        }

        function exec(cmd, val = null) { document.getElementById('editor').focus(); document.execCommand(cmd, false, val); autoSave(); }

        function updateCanvasColor(color) { 
            document.getElementById('canvasFrame').style.backgroundColor = color; 
            const note = notes.find(n => n.id === activeId); if (note) note.color = color; saveData(); 
        }

        function loadNote() {
            const note = notes.find(n => n.id === activeId);
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('editor').innerHTML = note.content;
            document.getElementById('canvasFrame').style.backgroundColor = note.color || "var(--paper)";
        }

        function autoSave() {
            const note = notes.find(n => n.id === activeId);
            if (note) {
                note.title = document.getElementById('noteTitle').value;
                note.content = document.getElementById('editor').innerHTML;
                saveData();
                document.getElementById('saveStatus').innerText = "Saving...";
                setTimeout(() => document.getElementById('saveStatus').innerText = "Saved", 500);
            }
        }

        function deleteActiveNote() { if(confirm("Delete Idea?")) { notes = notes.filter(n => n.id !== activeId); saveData(); exitToHome(); } }

        function renderDashboard() {
            const grid = document.getElementById('noteGrid');
            document.getElementById('statCount').innerText = notes.length;
            grid.innerHTML = `<div class="note-widget add-new" onclick="enterCanvas(null)"><h3>＋</h3><b>New Idea</b></div>`;
            notes.forEach(n => {
                const widget = document.createElement('div');
                widget.className = 'note-widget';
                widget.style.backgroundColor = n.color || 'var(--card-bg)';
                widget.onclick = () => enterCanvas(n.id);
                widget.innerHTML = `<h4>${n.title || 'Draft Idea'}</h4><p style="font-size:0.7rem; opacity:0.4; margin-top:auto;">${new Date(n.id).toLocaleDateString()}</p>`;
                grid.appendChild(widget);
            });
        }

        function saveData() { localStorage.setItem('BookLandData', JSON.stringify(notes)); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        renderDashboard();
    </script>
</body>
</html>
