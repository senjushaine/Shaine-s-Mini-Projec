<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idea BookLand</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700;800&display=swap');

        :root {
            --bg: #0f172a; --sidebar: #1e293b; --text: #f1f5f9;
            --border: rgba(255,255,255,0.1); --paper: #1e293b;
            --accent: #00BFC0;
            --grad-main: linear-gradient(45deg, #00A1D8, #FE0D6D);
        }

        .light-mode {
            --bg: #f8fafc; --sidebar: #ffffff; --text: #0f172a;
            --border: rgba(0,0,0,0.08); --paper: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: background 0.4s; }
        body, html { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        .screen { position: fixed; inset: 0; display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
        .screen.active { display: flex; opacity: 1; transform: translateY(0); }

        /* --- DASHBOARD --- */
        #homeScreen { flex-direction: column; padding: 30px 25px; overflow-y: auto; }
        .logo-main { font-family: 'Pacifico', cursive; font-size: 2.4rem; background: var(--grad-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .stats-row { display: flex; gap: 15px; margin: 25px 0; }
        .stat-card { flex: 1; background: var(--sidebar); padding: 20px; border-radius: 24px; border: 1px solid var(--border); }
        .stat-val { font-size: 1.8rem; font-weight: 700; color: #F7CE15; display: block; }
        
        .note-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .widget-new { 
            background: linear-gradient(135deg, #FE0D6D 0%, #00A1D8 100%); 
            aspect-ratio: 1/1; border-radius: 28px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; font-weight: 700; cursor: pointer;
        }

        /* --- CANVAS --- */
        #canvasScreen { flex-direction: row; }
        #sideBar { width: 70px; background: var(--sidebar); display: flex; flex-direction: column; align-items: center; padding: 15px 0; border-right: 1px solid var(--border); z-index: 100; transition: 0.3s; }
        .toolbar-hidden #sideBar { margin-left: -70px; }

        .t-btn { width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; color: var(--text); font-size: 1.1rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
        .t-btn:active { background: rgba(255,255,255,0.1); }
        
        .palette-popup {
            position: fixed; left: 80px; bottom: 80px; background: var(--sidebar);
            border: 1px solid var(--border); border-radius: 20px; padding: 15px;
            display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; z-index: 200;
        }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }

        #editor { flex: 1; padding: 20px 30px; font-size: 1.2rem; overflow-y: auto; line-height: 1.6; outline: none; }
        #titleInput { width: 100%; border: none; background: transparent; color: var(--text); font-size: 2.2rem; font-weight: 800; padding: 40px 30px 10px; font-family: 'Playfair Display', serif; outline: none; }

        .fab-tool { position: fixed; bottom: 25px; left: 15px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: white; border: none; z-index: 1000; font-size: 1.3rem; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="toolbar-hidden">

    <section id="homeScreen" class="screen active">
        <div class="logo-main">Idea BookLand</div>
        <p style="opacity:0.5; font-size:0.8rem; margin-top:-5px;">Premium Digital Workspace</p>

        <div class="stats-row">
            <div class="stat-card">
                <span style="font-size:0.7rem; opacity:0.6; text-transform:uppercase;">Total Ideas</span>
                <span id="totalCount" class="stat-val">0</span>
            </div>
            <div class="stat-card" onclick="openNote(null)">
                <span style="font-size:0.7rem; opacity:0.6; text-transform:uppercase;">Today</span>
                <span class="stat-val" style="color:var(--accent)">New</span>
            </div>
        </div>

        <h3 style="margin-bottom:15px;">Recent Space</h3>
        <div class="note-grid" id="noteGrid">
            <div class="widget-new" onclick="openNote(null)">
                <span style="font-size:2.5rem; margin-bottom:5px;">+</span>
                <span>Create Idea</span>
            </div>
        </div>
    </section>

    <section id="canvasScreen" class="screen">
        <button class="fab-tool" onclick="document.body.classList.toggle('toolbar-hidden')">⚒</button>
        
        <aside id="sideBar">
            <button class="t-btn" onclick="closeNote()">🏠</button>
            <div style="height:1px; width:30px; background:var(--border); margin:10px 0;"></div>
            
            <button class="t-btn" onclick="doc('bold')"><b>B</b></button>
            <button class="t-btn" onclick="doc('italic')"><i>I</i></button>
            
            <div style="height:1px; width:30px; background:var(--border); margin:10px 0;"></div>
            <button class="t-btn" onclick="doc('justifyLeft')" title="Align Left">|<≡</button>
            <button class="t-btn" onclick="doc('justifyCenter')" title="Align Center">≡</button>
            <button class="t-btn" onclick="doc('justifyRight')" title="Align Right">≡>|</button>
            <button class="t-btn" onclick="doc('justifyFull')" title="Cancel/Justify" style="color:#FE0D6D;">✕</button>
            
            <div style="margin-top:auto;">
                <button class="t-btn" onclick="pop('text')" style="color:var(--accent); font-weight:700;">A</button>
            </div>
        </aside>

        <div id="palettePop" class="palette-popup"></div>

        <div style="flex:1; display:flex; flex-direction:column;" id="canvasBg">
            <input type="text" id="titleInput" placeholder="Idea Name..." oninput="save()">
            <div id="editor" contenteditable="true" oninput="save()"></div>
        </div>
    </section>

    <script>
        let db = JSON.parse(localStorage.getItem('BookLandFinal')) || [];
        let activeId = null;
        let lastRange = null;

        const colors = ["#EE7EA0", "#FE0D6D", "#00A1D8", "#00BFC0", "#91CA57", "#F7CE15", "#FD5E00", "#7851A5", "#363636", "#AAAAAA", "#FFFFFF"];

        function init() {
            const container = document.getElementById('palettePop');
            colors.forEach(c => {
                const d = document.createElement('div');
                d.className = 'color-dot';
                d.style.backgroundColor = c;
                d.onmousedown = (e) => { e.preventDefault(); applyColor(c); };
                container.appendChild(d);
            });
            renderHome();
        }

        const editor = document.getElementById('editor');
        editor.addEventListener('mouseup', () => { lastRange = window.getSelection().getRangeAt(0); });
        editor.addEventListener('keyup', () => { lastRange = window.getSelection().getRangeAt(0); });

        function applyColor(c) {
            if (lastRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(lastRange);
            }
            document.execCommand('foreColor', false, c);
            editor.focus();
            document.getElementById('palettePop').style.display = 'none';
            save();
        }

        function renderHome() {
            const grid = document.getElementById('noteGrid');
            const widget = grid.firstElementChild;
            grid.innerHTML = '';
            grid.appendChild(widget);
            
            db.forEach(n => {
                const card = document.createElement('div');
                card.style.cssText = "background:var(--sidebar); padding:20px; border-radius:28px; border:1px solid var(--border); aspect-ratio:1/1;";
                card.innerHTML = `<h4 style="margin:0;">${n.title || 'Draft'}</h4><p style="font-size:0.7rem; opacity:0.5;">${n.date}</p>`;
                card.onclick = () => openNote(n.id);
                grid.appendChild(card);
            });
            document.getElementById('totalCount').innerText = db.length;
        }

        function openNote(id) {
            if(!id) {
                const n = { id: Date.now(), title: "", content: "", date: new Date().toLocaleDateString() };
                db.unshift(n); activeId = n.id;
            } else { activeId = id; }
            const note = db.find(n => n.id === activeId);
            document.getElementById('titleInput').value = note.title;
            document.getElementById('editor').innerHTML = note.content;
            switchScreen('canvasScreen');
        }

        function closeNote() { switchScreen('homeScreen'); renderHome(); }
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                const target = document.getElementById(id);
                target.style.display = 'flex';
                setTimeout(() => target.classList.add('active'), 50);
            }, 400);
        }

        function doc(cmd) { document.execCommand(cmd, false, null); editor.focus(); save(); }
        function pop() { const p = document.getElementById('palettePop'); p.style.display = p.style.display === 'grid' ? 'none' : 'grid'; }
        
        function save() {
            const n = db.find(n => n.id === activeId);
            if(n) {
                n.title = document.getElementById('titleInput').value;
                n.content = document.getElementById('editor').innerHTML;
                localStorage.setItem('BookLandFinal', JSON.stringify(db));
            }
        }
        init();
    </script>
</body>
</html>
