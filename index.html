<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenNotes Pro</title>
    <style>
        :root {
            --bg: #0f172a; --sidebar: #1e293b; --text: #f1f5f9;
            --accent: #38bdf8; --border: #334155; --danger: #ef4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica; 
            background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
        }

        /* Responsive Sidebar */
        #sidebar {
            width: 280px; background: var(--sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; z-index: 10;
        }
        .sidebar-hidden #sidebar { margin-left: -280px; }

        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-new {
            margin: 0 15px 15px; padding: 12px; background: var(--accent); color: #000;
            border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        .note-list { flex: 1; overflow-y: auto; padding: 10px; }
        .note-item {
            padding: 15px; border-radius: 12px; margin-bottom: 8px; cursor: pointer;
            border: 1px solid transparent; transition: 0.2s;
        }
        .note-item.active { background: #334155; border-color: var(--accent); }

        /* Modern Main Area */
        #main { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        header { 
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
        }

        .editor-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        #noteTitle {
            background: transparent; border: none; color: var(--text);
            font-size: 1.8rem; font-weight: bold; outline: none; margin-bottom: 10px; width: 100%;
        }
        #editor {
            flex: 1; outline: none; font-size: 1.1rem; line-height: 1.6; min-height: 200px;
        }

        /* Floating Action Buttons for Mobile */
        .fab-group { display: flex; gap: 10px; }
        .btn-icon { 
            background: #334155; border: none; color: var(--text); padding: 8px 12px; 
            border-radius: 8px; cursor: pointer; font-size: 0.9rem;
        }
        .btn-del { background: #450a0a; color: var(--danger); }

        /* Focus & Toast */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #000; padding: 8px 20px;
            border-radius: 20px; font-size: 0.8rem; opacity: 0; transition: 0.3s; pointer-events: none;
        }
        .show-toast #toast { opacity: 1; bottom: 30px; }

        @media (max-width: 600px) {
            #sidebar { position: absolute; height: 100%; }
            .sidebar-hidden #sidebar { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="sidebar-hidden">

    <aside id="sidebar">
        <div class="sidebar-header">
            <span style="letter-spacing: 2px; font-weight: 800; color: var(--accent);">ZEN PRO</span>
            <button class="btn-icon" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="btn-new" onclick="addNote()">+ NEW NOTE</button>
        <div id="noteList" class="note-list"></div>
    </aside>

    <main id="main">
        <header>
            <button class="btn-icon" onclick="toggleSidebar()">☰ MENU</button>
            <div class="fab-group">
                <button class="btn-icon" onclick="downloadNote()">💾 TXT</button>
                <button class="btn-icon btn-del" onclick="deleteNote()">🗑 DELETE</button>
            </div>
        </header>

        <div class="editor-container">
            <input type="text" id="noteTitle" placeholder="Note Title..." oninput="autoSave()">
            <div id="editor" contenteditable="true" oninput="autoSave()"></div>
        </div>
        
        <div id="toast">Saved to storage</div>
    </main>

    <script>
        let notes = JSON.parse(localStorage.getItem('ZenData')) || [];
        let activeId = null;

        function init() {
            if (notes.length === 0) addNote();
            else selectNote(notes[0].id);
            renderList();
        }

        function addNote() {
            const newNote = { id: Date.now(), title: "Untitled Note", content: "" };
            notes.unshift(newNote);
            selectNote(newNote.id);
            save();
        }

        function selectNote(id) {
            activeId = id;
            const note = notes.find(n => n.id === id);
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('editor').innerHTML = note.content;
            if (window.innerWidth < 600) toggleSidebar(); 
            renderList();
        }

        function autoSave() {
            const note = notes.find(n => n.id === activeId);
            note.title = document.getElementById('noteTitle').value || "Untitled Note";
            note.content = document.getElementById('editor').innerHTML;
            save();
            showToast();
        }

        function deleteNote() {
            if (confirm("Delete this note?")) {
                notes = notes.filter(n => n.id !== activeId);
                if (notes.length === 0) addNote();
                else selectNote(notes[0].id);
                save();
            }
        }

        function save() {
            localStorage.setItem('ZenData', JSON.stringify(notes));
            renderList();
        }

        function renderList() {
            const list = document.getElementById('noteList');
            list.innerHTML = notes.map(n => `
                <div class="note-item ${n.id === activeId ? 'active' : ''}" onclick="selectNote(${n.id})">
                    <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${n.title}</div>
                    <div style="font-size:0.7rem; opacity:0.5; margin-top:5px;">${n.content.replace(/<[^>]*>/g, '').substring(0, 30)}...</div>
                </div>
            `).join('');
        }

        function toggleSidebar() { document.body.classList.toggle('sidebar-hidden'); }

        function showToast() {
            document.body.classList.add('show-toast');
            setTimeout(() => document.body.classList.remove('show-toast'), 1500);
        }

        function downloadNote() {
            const note = notes.find(n => n.id === activeId);
            const blob = new Blob([note.content.replace(/<[^>]*>/g, '')], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${note.title}.txt`;
            a.click();
        }

        init();
    </script>
</body>
    </html>
