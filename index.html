<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idea BookLand</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --bg: #0f172a; --sidebar: #1e293b; --text: #f1f5f9;
            --border: rgba(255,255,255,0.1); --paper: #1e293b;
            --accent: #00BFC0;
            --grad-pink: linear-gradient(135deg, #FE0D6D 0%, #FF9797 100%);
            --grad-blue: linear-gradient(135deg, #00A1D8 0%, #00BFC0 100%);
            --grad-purple: linear-gradient(135deg, #7851A5 0%, #E6B1D3 100%);
            --grad-orange: linear-gradient(135deg, #FD5E00 0%, #FFCC80 100%);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* --- HOME SCREEN GRID --- */
        #homeScreen { height: 100vh; overflow-y: auto; padding: 0 25px 120px; display: none; flex-direction: column; }
        #homeScreen.active { display: flex; }
        
        .logo-area { padding: 40px 0 20px; }
        .logo-main { font-family: 'Pacifico', cursive; font-size: 2.6rem; background: linear-gradient(45deg, #00A1D8, #FE0D6D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .note-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; 
            width: 100%;
        }

        .note-card { 
            aspect-ratio: 1/1; padding: 22px; border-radius: 28px; position: relative; 
            transition: all 0.3s ease; display: flex; flex-direction: column; overflow: hidden;
            background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .note-card[data-style="pink"] { background: var(--grad-pink); color: white; border: none; }
        .note-card[data-style="blue"] { background: var(--grad-blue); color: white; border: none; }
        .note-card[data-style="purple"] { background: var(--grad-purple); color: white; border: none; }
        .note-card[data-style="orange"] { background: var(--grad-orange); color: white; border: none; }

        /* LONG PRESS DELETE */
        .note-card.editing { animation: wiggle 0.3s infinite; filter: brightness(0.7); }
        @keyframes wiggle { 0% {transform: rotate(-1deg);} 50% {transform: rotate(1deg);} 100% {transform: rotate(-1deg);} }
        .del-overlay { position: absolute; inset: 0; background: rgba(255, 30, 30, 0.8); display: none; align-items: center; justify-content: center; z-index: 5; font-size: 2rem; color: white; border-radius: 28px; }
        .editing .del-overlay { display: flex; }

        /* --- MAXIMIZED CANVAS --- */
        #canvasScreen { position: fixed; inset: 0; display: none; background: var(--bg); flex-direction: row; }
        #canvasScreen.active { display: flex; }

        #sideBar { width: 75px; background: var(--sidebar); display: flex; flex-direction: column; align-items: center; padding: 15px 0; border-right: 1px solid var(--border); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 50; flex-shrink: 0; }
        .toolbar-hidden #sideBar { margin-left: -75px; opacity: 0; pointer-events: none; }

        .t-btn { width: 50px; height: 50px; border-radius: 14px; border: none; background: transparent; color: var(--text); font-size: 1.3rem; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        .t-btn:active { background: rgba(255,255,255,0.1); }

        .palette-popup {
            position: fixed; left: 85px; bottom: 80px; background: var(--sidebar);
            border: 1px solid var(--border); border-radius: 20px; padding: 15px;
            display: none; grid-template-columns: repeat(4, 1fr); gap: 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); z-index: 100;
        }
        .color-dot { width: 35px; height: 35px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }

        .editor-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--paper); }
        #editor { flex: 1; padding: 10px 25px 40px; font-size: 1.25rem; overflow-y: auto; line-height: 1.6; color: var(--text); }
        #titleInput { width: 100%; border: none; background: transparent; color: var(--text); font-size: 2.2rem; font-weight: 700; padding: 35px 25px 5px; outline: none; }

        .tool-toggle { position: fixed; bottom: 25px; left: 15px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: white; border: none; z-index: 1000; font-size: 1.4rem; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .floating-add { position: fixed; bottom: 30px; right: 25px; width: 70px; height: 70px; border-radius: 24px; background: var(--accent); color: white; border: none; font-size: 2rem; box-shadow: 0 10px 25px rgba(0,191,192,0.3); z-index: 100; }
        
        #doneBtn { position: fixed; top: 40px; right: 25px; display: none; color: var(--accent); font-weight: 700; z-index: 101; background: rgba(15,23,42,0.8); padding: 5px 15px; border-radius: 10px; }
    </style>
</head>
<body class="toolbar-hidden">

    <section id="homeScreen" class="active">
        <div class="logo-area">
            <div class="logo-main">Idea BookLand</div>
            <p style="opacity: 0.4; font-size: 0.85rem; margin-top: 4px;">by Shaine Khant Paing</p>
        </div>
        <div id="doneBtn" onclick="exitEdit()">Done</div>
        <div class="note-grid" id="noteGrid"></div>
        <button class="floating-add" onclick="openNote(null)">＋</button>
    </section>

    <section id="canvasScreen">
        <button class="tool-toggle" onclick="document.body.classList.toggle('toolbar-hidden')">⚒</button>
        
        <aside id="sideBar">
            <button class="t-btn" onclick="goHome()">🏠</button>
            <div style="height:1px; width:35px; background:var(--border); margin:8px 0;"></div>
            <button class="t-btn" onclick="format('bold')"><b>B</b></button>
            <button class="t-btn" onclick="format('italic')"><i>I</i></button>
            <button class="t-btn" onclick="format('underline')"><u>U</u></button>
            <button class="t-btn" onclick="format('insertUnorderedList')">●</button>
            <div style="margin-top:auto;">
                <button class="t-btn" onclick="togglePalette()" style="background:#FE0D6D; color:white; border-radius: 50%;">🎨</button>
            </div>
        </aside>

        <div id="paletteBox" class="palette-popup"></div>

        <div class="editor-container" id="canvasPaper">
            <header style="padding:15px 25px 0; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.75rem; font-weight:600; color:var(--accent); letter-spacing:1px;">SYNCED</span>
                <button onclick="goHome()" style="background:rgba(255,255,255,0.05); border:none; color:var(--text); padding:8px 15px; border-radius:12px; font-size:0.85rem;">Exit</button>
            </header>
            <input type="text" id="titleInput" placeholder="Title..." oninput="autoSave()">
            <div id="editor" contenteditable="true" oninput="autoSave()"></div>
        </div>
    </section>

    <script>
        let notes = JSON.parse(localStorage.getItem('BookLandFinal')) || [];
        let activeNoteId = null;
        let editMode = false;
        let holdTimer;

        // GOODNOTES HEX CODES
        const colors = ["#EE7EA0", "#FE0D6D", "#00A1D8", "#00BFC0", "#91CA57", "#F7CE15", "#FD5E00", "#7851A5", "#363636", "#AAAAAA", "#F1ECEA", "#FFFFFF"];
        const styles = ['pink', 'blue', 'purple', 'orange'];

        function init() {
            const box = document.getElementById('paletteBox');
            colors.forEach(c => {
                const d = document.createElement('div');
                d.className = 'color-dot';
                d.style.backgroundColor = c;
                d.onclick = () => updatePaperColor(c);
                box.appendChild(d);
            });
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('noteGrid');
            grid.innerHTML = '';
            notes.forEach(n => {
                const card = document.createElement('div');
                card.className = `note-card ${editMode ? 'editing' : ''}`;
                card.setAttribute('data-style', n.style || '');
                if(n.bgColor) card.style.backgroundColor = n.bgColor;

                card.innerHTML = `
                    <div class="del-overlay" onclick="deleteNote(event, ${n.id})">🗑️</div>
                    <h4 style="margin:0; font-size:1.15rem; line-height:1.3;">${n.title || 'Untitled'}</h4>
                    <p style="font-size:0.7rem; opacity:0.5; margin-top:auto;">${new Date(n.id).toLocaleDateString()}</p>
                `;
                
                card.onmousedown = card.ontouchstart = () => { if(!editMode) holdTimer = setTimeout(enterEdit, 800); };
                card.onmouseup = card.ontouchend = () => clearTimeout(holdTimer);
                card.onclick = () => { if(!editMode) openNote(n.id); };
                grid.appendChild(card);
            });
        }

        function enterEdit() { editMode = true; document.getElementById('doneBtn').style.display = 'block'; renderGrid(); }
        function exitEdit() { editMode = false; document.getElementById('doneBtn').style.display = 'none'; renderGrid(); }

        function deleteNote(e, id) {
            e.stopPropagation();
            notes = notes.filter(n => n.id !== id);
            save(); renderGrid();
            if(notes.length === 0) exitEdit();
        }

        function openNote(id) {
            if(!id) {
                const newNote = { id: Date.now(), title: "", content: "", style: styles[Math.floor(Math.random()*4)] };
                notes.unshift(newNote); activeNoteId = newNote.id;
            } else { activeNoteId = id; }
            
            const note = notes.find(n => n.id === activeNoteId);
            document.getElementById('titleInput').value = note.title;
            document.getElementById('editor').innerHTML = note.content;
            document.getElementById('canvasPaper').style.backgroundColor = note.bgColor || "var(--paper)";
            
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('canvasScreen').classList.add('active');
            document.body.classList.add('toolbar-hidden');
        }

        function goHome() {
            document.getElementById('canvasScreen').classList.remove('active');
            document.getElementById('homeScreen').classList.add('active');
            renderGrid();
        }

        function format(cmd) { document.execCommand(cmd, false, null); autoSave(); }
        function togglePalette() { const p = document.getElementById('paletteBox'); p.style.display = p.style.display === 'grid' ? 'none' : 'grid'; }
        
        function updatePaperColor(c) {
            document.getElementById('canvasPaper').style.backgroundColor = c;
            const note = notes.find(n => n.id === activeNoteId);
            if(note) { note.bgColor = c; note.style = null; }
            save(); togglePalette();
        }

        function autoSave() {
            const note = notes.find(n => n.id === activeNoteId);
            if(note) {
                note.title = document.getElementById('titleInput').value;
                note.content = document.getElementById('editor').innerHTML;
                save();
            }
        }

        function save() { localStorage.setItem('BookLandFinal', JSON.stringify(notes)); }

        init();
    </script>
</body>
</html>
