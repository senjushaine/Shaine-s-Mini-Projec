<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idea BookLand</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700;800&display=swap');

        :root {
            --bg: #0f172a; --sidebar: #1e293b; --text: #f1f5f9;
            --border: rgba(255,255,255,0.1); --paper: #1e293b;
            --accent: #00BFC0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        .screen { position: fixed; inset: 0; display: none; opacity: 0; transition: 0.3s ease; }
        .screen.active { display: flex; opacity: 1; }

        /* --- DASHBOARD --- */
        #homeScreen { flex-direction: column; padding: 40px 25px; overflow-y: auto; }
        .logo-main { font-family: 'Pacifico', cursive; font-size: 2.2rem; color: #FE0D6D; margin: 0; }
        .user-sig { font-size: 0.85rem; opacity: 0.6; margin-top: -5px; margin-bottom: 25px; }
        
        .stats-row { display: flex; gap: 12px; margin-bottom: 30px; }
        .stat-card { flex: 1; background: var(--sidebar); padding: 18px; border-radius: 22px; border: 1px solid var(--border); }
        .stat-val { font-size: 1.6rem; font-weight: 700; display: block; }
        
        .note-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .widget-new { 
            background: linear-gradient(135deg, #FE0D6D, #00A1D8); 
            aspect-ratio: 1/1; border-radius: 25px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: white; font-weight: 700;
        }

        /* Stealth Select Button with Icon */
        .select-btn { 
            display: none; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; 
            padding: 12px; border-radius: 15px; margin-bottom: 15px; width: 100%; font-weight: 600;
        }

        .shaking { animation: shake 0.3s infinite; border: 2px solid #FE0D6D !important; opacity: 0.8; }
        @keyframes shake { 0% { transform: rotate(1deg); } 50% { transform: rotate(-1deg); } }

        /* --- CANVAS --- */
        #canvasScreen { flex-direction: row; }
        #sideBar { width: 65px; background: var(--sidebar); display: flex; flex-direction: column; align-items: center; padding: 15px 0; border-right: 1px solid var(--border); }
        .t-btn { width: 42px; height: 42px; border-radius: 10px; border: none; background: transparent; color: var(--text); font-size: 1.1rem; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        
        .palette-popup {
            position: fixed; left: 75px; bottom: 80px; background: var(--sidebar);
            border: 1px solid var(--border); border-radius: 20px; padding: 12px;
            display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; z-index: 200;
        }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }

        #editor { flex: 1; padding: 20px 25px; font-size: 1.2rem; overflow-y: auto; outline: none; line-height: 1.5; }
        #titleInput { width: 100%; border: none; background: transparent; color: var(--text); font-size: 2.2rem; font-weight: 800; padding: 35px 25px 5px; outline: none; font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>

    <section id="homeScreen" class="screen active">
        <h1 class="logo-main">Idea BookLand</h1>
        <div class="user-sig">by Shaine Khant Paing</div>

        <div class="stats-row">
            <div class="stat-card">
                <span style="font-size:0.65rem; opacity:0.5; text-transform:uppercase;">Total Ideas</span>
                <span id="totalCount" class="stat-val" style="color:#F7CE15;">0</span>
            </div>
            <div class="stat-card">
                <span style="font-size:0.65rem; opacity:0.5; text-transform:uppercase;">Today</span>
                <span class="stat-val" style="color:#00BFC0">New</span>
            </div>
        </div>

        <button id="selBtn" class="select-btn" onclick="exitSelectMode()">✅ Done Deleting</button>

        <div class="note-grid" id="noteGrid">
            <div class="widget-new" onclick="openNote(null)">
                <span style="font-size:2.5rem;">+</span>
                <span>Create Idea</span>
            </div>
        </div>
    </section>

    <section id="canvasScreen" class="screen">
        <aside id="sideBar">
            <button class="t-btn" onclick="closeNote()">🏠</button>
            <div style="height:1px; width:30px; background:var(--border); margin:10px 0;"></div>
            <button class="t-btn" onclick="doc('bold')"><b>B</b></button>
            <button class="t-btn" onclick="doc('italic')"><i>I</i></button>
            <div style="height:1px; width:30px; background:var(--border); margin:10px 0;"></div>
            <button class="t-btn" onclick="doc('justifyLeft')">|<≡</button>
            <button class="t-btn" onclick="doc('justifyCenter')">≡</button>
            <button class="t-btn" onclick="doc('justifyRight')">≡>|</button>
            <div style="margin-top:auto;">
                <button class="t-btn" onclick="pop()" style="color:var(--accent); font-weight:900; border: 1.5px solid var(--accent);">A</button>
            </div>
        </aside>

        <div id="palettePop" class="palette-popup"></div>

        <div style="flex:1; display:flex; flex-direction:column;">
            <input type="text" id="titleInput" placeholder="Idea Name..." oninput="save()">
            <div id="editor" contenteditable="true" oninput="save()"></div>
        </div>
    </section>

    <script>
        let db = JSON.parse(localStorage.getItem('BookLand_Final_V1')) || [];
        let activeId = null;
        let isSelectMode = false;
        let lastRange = null;
        let pressTimer;

        const colors = ["#EE7EA0", "#FE0D6D", "#00A1D8", "#00BFC0", "#91CA57", "#F7CE15", "#FD5E00", "#7851A5", "#363636", "#AAAAAA", "#FFFFFF"];

        function init() {
            const container = document.getElementById('palettePop');
            colors.forEach(c => {
                const d = document.createElement('div');
                d.className = 'color-dot';
                d.style.backgroundColor = c;
                d.onmousedown = (e) => { e.preventDefault(); applyColor(c); };
                container.appendChild(d);
            });
            renderHome();
        }

        const editor = document.getElementById('editor');
        editor.onmouseup = editor.onkeyup = () => { 
            const sel = window.getSelection();
            if (sel.rangeCount > 0) lastRange = sel.getRangeAt(0);
        };

        function applyColor(c) {
            if (lastRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(lastRange);
            }
            document.execCommand('foreColor', false, c);
            editor.focus();
            document.getElementById('palettePop').style.display = 'none';
            save();
        }

        function startPress() {
            if (isSelectMode) return;
            pressTimer = window.setTimeout(() => {
                isSelectMode = true;
                document.getElementById('selBtn').style.display = 'block';
                renderHome();
            }, 800);
        }

        function endPress() { clearTimeout(pressTimer); }

        function exitSelectMode() {
            isSelectMode = false;
            document.getElementById('selBtn').style.display = 'none';
            renderHome();
        }

        function renderHome() {
            const grid = document.getElementById('noteGrid');
            const widget = grid.firstElementChild;
            grid.innerHTML = ''; grid.appendChild(widget);
            
            db.forEach(n => {
                const card = document.createElement('div');
                card.className = isSelectMode ? 'shaking' : '';
                card.style.cssText = "background:var(--sidebar); padding:20px; border-radius:25px; border:1px solid var(--border); aspect-ratio:1/1; position:relative;";
                card.innerHTML = `<h4 style="margin:0; font-size:1rem;">${n.title || 'Draft Idea'}</h4><p style="font-size:0.7rem; opacity:0.4; margin-top:8px;">${n.date}</p>`;
                
                card.ontouchstart = startPress;
                card.ontouchend = endPress;
                card.onmousedown = startPress;
                card.onmouseup = endPress;

                card.onclick = () => {
                    if(isSelectMode) {
                        db = db.filter(item => item.id !== n.id);
                        save(); renderHome();
                    } else { openNote(n.id); }
                };
                grid.appendChild(card);
            });
            document.getElementById('totalCount').innerText = db.length;
        }

        function openNote(id) {
            if(!id) {
                const n = { id: Date.now(), title: "", content: "", date: new Date().toLocaleDateString() };
                db.unshift(n); activeId = n.id;
            } else { activeId = id; }
            const note = db.find(n => n.id === activeId);
            document.getElementById('titleInput').value = note.title;
            document.getElementById('editor').innerHTML = note.content;
            switchScreen('canvasScreen');
        }

        function closeNote() { switchScreen('homeScreen'); renderHome(); }
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                const target = document.getElementById(id);
                target.style.display = 'flex';
                setTimeout(() => target.classList.add('active'), 50);
            }, 300);
        }

        function doc(cmd) { document.execCommand(cmd, false, null); editor.focus(); save(); }
        function pop() { const p = document.getElementById('palettePop'); p.style.display = p.style.display === 'grid' ? 'none' : 'grid'; }
        
        function save() {
            const n = db.find(n => n.id === activeId);
            if(n) {
                n.title = document.getElementById('titleInput').value;
                n.content = document.getElementById('editor').innerHTML;
            }
            localStorage.setItem('BookLand_Final_V1', JSON.stringify(db));
        }
        init();
    </script>
</body>
</html>
