<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenNotes Pro v4</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="dark-mode" id="appBody">

    <aside id="sidebar">
        <div class="sidebar-header">
            <span class="logo">ZEN NOTES</span>
            <button class="btn-icon" onclick="toggleTheme()" title="Toggle Dark Mode">🌓</button>
        </div>
        
        <button class="btn-new" onclick="createNewNote()">+ New Note</button>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search notes..." oninput="renderNoteList()">
        </div>

        <div id="noteList" class="note-list">
            </div>
    </aside>

    <main id="editorContainer">
        <header class="toolbar">
            <div class="toolbar-left">
                <button class="btn-menu" onclick="toggleSidebar()">☰</button>
                <span id="statusIndicator">Saved</span>
            </div>
            <div class="toolbar-right">
                <button class="btn-secondary" onclick="enterFocusMode()">Focus</button>
                <button class="btn-secondary" onclick="downloadTxt()">Export TXT</button>
                <button class="btn-danger" onclick="deleteCurrentNote()">Delete</button>
            </div>
        </header>

        <section class="writing-area">
            <input type="text" id="noteTitle" class="title-field" placeholder="Untitled Note" oninput="handleInput()">
            <div class="meta-data">
                <span id="lastEditedText">Last edited: Just now</span> | 
                <span id="wordCount">0 words</span>
            </div>
            <div id="editor" contenteditable="true" class="main-editor" oninput="handleInput()" placeholder="Start writing your thoughts..."></div>
        </section>
    </main>

    <div id="toast">Changes saved</div>

    <script src="script.js"></script>
</body>
</html>
